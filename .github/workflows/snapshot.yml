name: snapshot-prices
on:
  schedule:
    - cron: "0 9 * * *"   # 10h à Paris en hiver (UTC+1), 11h en été
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python -m src.data.snapshot_prices
      - name: Commit du snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add snapshots
          git diff --cached --quiet || (git commit -m "Snapshot prix $(date -u +%F)" && git push)